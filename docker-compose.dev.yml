version: '3.8'

services:
  # PostgreSQL + TimescaleDB (base de datos)
  db:
    image: timescale/timescaledb:latest-pg14
    container_name: economia-ve-db-dev
    environment:
      POSTGRES_DB: economia_ve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - economia-network-dev

  # Redis Cache (opcional)
  redis:
    image: redis:alpine
    container_name: economia-ve-redis-dev
    ports:
      - "6379:6379"
    networks:
      - economia-network-dev

  # App principal (con hot-reload via volumes)
  app:
    build: .
    container_name: economia-ve-app-dev
    command: python main.py
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/economia_ve
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      - db
      - redis
    networks:
      - economia-network-dev

  # Dashboard Streamlit (con hot-reload)
  dashboard:
    build: .
    container_name: economia-ve-dashboard-dev
    command: streamlit run src/dashboard/app.py --server.port=8501 --server.runOnSave=true
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/economia_ve
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      - db
      - redis
    networks:
      - economia-network-dev

volumes:
  postgres_data_dev:

networks:
  economia-network-dev:
    driver: bridge
