services:
  db:
    image: timescale/timescaledb:latest-pg14
    container_name: economia-ve-db-dev
    environment:
      POSTGRES_DB: economia_ve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d economia_ve"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - economia-network-dev

  redis:
    image: redis:alpine
    container_name: economia-ve-redis-dev
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - economia-network-dev

  # Sin servicio `app`: el scheduler APScheduler se retiró (los jobs los
  # dispara n8n). `python main.py` queda como bootstrap del esquema.

  runner:
    build: .
    container_name: economia-ve-runner-dev
    command: uvicorn src.api.runner:app --host 0.0.0.0 --port 8090 --reload
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/economia_ve
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - DEBUG=true
      - RUNNER_TOKEN=${RUNNER_TOKEN:-}
      - TZ=America/Caracas
      - TIMEZONE=America/Caracas
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - economia-network-dev

  dashboard:
    build: .
    container_name: economia-ve-dashboard-dev
    command: streamlit run src/dashboard/app.py --server.port=8501 --server.address=127.0.0.1 --server.runOnSave=true
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/economia_ve
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - economia-network-dev

volumes:
  postgres_data_dev:

networks:
  economia-network-dev:
    driver: bridge
