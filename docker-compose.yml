services:
  # Scheduler: ya no hay proceso APScheduler. Los jobs los dispara n8n
  # (ver n8n/README.md); `python main.py` solo hace bootstrap del esquema.

  # Runner HTTP: n8n lo invoca para ejecutar los CLIs (allowlist + token).
  # Publicado solo en loopback; n8n lo alcanza por host.docker.internal:8090.
  # Con `restart: unless-stopped` arranca solo al encender Docker.
  runner:
    build: .
    container_name: economia-ve-runner
    command: uvicorn src.api.runner:app --host 0.0.0.0 --port 8090
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/economia_ve
      - REDIS_URL=redis://redis:6379
      - RUNNER_TOKEN=${RUNNER_TOKEN:-}
      - TZ=America/Caracas
      - TIMEZONE=America/Caracas
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - economia-network
    restart: unless-stopped

  # Dashboard Streamlit (solo loopback: se accede por túnel/SSH)
  dashboard:
    build: .
    container_name: economia-ve-dashboard
    # Dentro del contenedor debe escuchar 0.0.0.0: si se ata a 127.0.0.1 el
    # publish de Docker no llega y el dashboard queda inaccesible desde el host.
    # El puerto publicado sigue en loopback.
    command: streamlit run src/dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/economia_ve
      - REDIS_URL=redis://redis:6379
      - TZ=America/Caracas
      - TIMEZONE=America/Caracas
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - economia-network
    restart: unless-stopped

  # PostgreSQL + TimescaleDB
  db:
    image: timescale/timescaledb:latest-pg14
    container_name: economia-ve-db
    environment:
      POSTGRES_DB: economia_ve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d economia_ve"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - economia-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: economia-ve-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - economia-network
    restart: unless-stopped

  # Prometheus (monitoring). Requiere ./config/prometheus.yml, aún ausente.
  prometheus:
    image: prom/prometheus
    container_name: economia-ve-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - economia-network

  # Grafana (metrics visualization)
  grafana:
    image: grafana/grafana
    container_name: economia-ve-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - economia-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  economia-network:
    driver: bridge
